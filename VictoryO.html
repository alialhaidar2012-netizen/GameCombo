<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Over!</title>
  <link rel="manifest" href="./Games/manifest.json" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: darkblue;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #GameOver {
            font-size: 15vmin;           /* Passt sich der Bildschirmgröße an */
            font-weight: 700;
            font-family: Arial, Helvetica, sans-serif;
            color: yellow;
            text-align: center;
            margin-bottom: 40px;
        }
        #Home {
            width: 40vmin;               /* Dynamische Breite */
            max-width: 250px;
            height: 10vmin;
            max-height: 60px;
            background-color: yellow;
            border: 2px solid black;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 3vmin;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #Home:hover {
            background-color: orange;
        }
        #Home:active {
            transform: scale(0.95);       /* Klick-Effekt auf Touch-Geräten */
        }
    </style>
</head>
<body>
<div id="GameOver">Player O won</div>
  </br>
<button id="Home" onclick="window.location.href='index.html'">Back to menu</button>  

</body>

</html>
