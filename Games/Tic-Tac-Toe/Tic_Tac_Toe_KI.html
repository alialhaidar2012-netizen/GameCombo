<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Tic-Tac-Toe</title>
      <link rel="manifest" href="../../manifest.json" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: lightgray;
        }
        #spielfeld {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #turn {
    position: absolute;
    top: 3vmin;
    left: 50%;
    transform: translateX(-50%);
    background-color: darkblue;
    color: yellow;
    padding: 2vmin 5vmin;
    border-radius: 3vmin;
    font-size: 4vmin;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    z-index: 5;
    white-space: nowrap;
}
        .zeile {
            clear: both;
            display: flex;
        }
        .feld {
            padding: 10px;
            border: 1px solid black;
            width: 25vmin;
            height: 25vmin;
            font-size: 10vmin;
            background: white;
            text-align: center;
            line-height: 25vmin;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="turn"></div>
    <div id="spielfeld">
        <div class="zeile">
            <div class="feld"></div>
            <div class="feld"></div>
            <div class="feld"></div>
        </div>
        <div class="zeile">
            <div class="feld"></div>
            <div class="feld"></div>
            <div class="feld"></div>
        </div>
        <div class="zeile">
            <div class="feld"></div>
            <div class="feld"></div>
            <div class="feld"></div>
        </div>
    </div>
     <script type="module">
    import{
     spielBeenden,
     getTrophiesforLevel
   } 
     from '../../Benutzerkonten_und_Ranglisten/Rangliste_und_Anmelden.js';

    let gewonnen = false
    let zuege= 0;
        if (sessionStorage.getItem("skipTutorial") !== "true" && localStorage.getItem("tutorialSkippedTTT") !== "true") {
        window.location.replace("Tic-Tac-Toe_Tutorial.html");
        }
   sessionStorage.clear();
         
        const felder = document.querySelectorAll('.feld');
        let spielerDran = false;
        setTimeout(computerDran, 1000);

        const gewinnLinien = [
            [1,2,3], [4,5,6], [7,8,9],
            [1,4,7], [2,5,8], [3,6,9],
            [1,5,9], [3,5,7]
        ];

        function pruefeGewinner(zeichen) {
            return gewinnLinien.some(linie =>
                linie.every(index => felder[index - 1].textContent === zeichen)
            );
        }

        async function computerDran() {
            let freieFelder = Array.from(felder).filter(feld => feld.textContent === "");
            if (freieFelder.length === 0) return;

            let zufall = Math.floor(Math.random() * freieFelder.length);
            freieFelder[zufall].textContent = "O";
            zuege++
            if (pruefeGewinner("O")) {
                let level = 1;
                const regeln = getTrophiesforLevel("TTT_Ki", level);
                const result = await spielBeenden("TTT_Ki", level, false);
                localStorage.setItem("Trophies", -regeln.verlust);
                localStorage.setItem("Victory", "false");
                window.location.replace("../Game_Over.html");
                return;
            }else if(zuege >= 9 && !gewonnen){
                let level = 1;
                const regeln = getTrophiesforLevel("TTT_Ki", level);
                await spielBeenden("TTT_Ki", level, false);
                localStorage.setItem("Trophies", -regeln.verlust);
                localStorage.setItem("Victory", "false");
                window.location.replace("../Draw.html");
                return;
            }
            spielerDran = true;
            turn.innerText= "Your turn";
        }

        felder.forEach(feld => {
            feld.addEventListener('click', async () => {
                if (!spielerDran) return;
                if (feld.textContent !== "") return;

                feld.textContent = "X";
                zuege++
                if (pruefeGewinner("X")) {
                    let level = 1;
                    gewonnen = true;
                    const regeln = getTrophiesforLevel("TTT_Ki", level);
                    await spielBeenden("TTT_Ki", level, true);
                    localStorage.setItem("Trophies", regeln.sieg);
                    localStorage.setItem("Victory", "true");
                    window.location.replace("../Victory.html");
                    return;
                }else if (zuege >= 9 && !gewonnen) {
                let level = 1;
                const regeln = getTrophiesforLevel("TTT_Ki", level);
                const result = await spielBeenden("TTT_Ki", level, false);
                localStorage.setItem("Trophies", regeln.sieg);
                localStorage.setItem("Victory", "false");
                window.location.replace("../Draw.html");
                return;
            }

                spielerDran = false;
                turn.innerText = "Computers turn";
                setTimeout(computerDran, 500);
            });
        });
    </script>

</body>
</html>
