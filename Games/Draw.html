<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw - GameCombo</title>
  <link rel="manifest" href="../manifest.json" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #3a3a5c, #2a2a4a);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    #DrawText {
      font-size: 15vmin;
      font-weight: 700;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #b0b0b0;
      text-align: center;
      margin-bottom: 40px;
      text-shadow: 0 0 5px #888888;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2vmin;
      z-index: 10;
      opacity: 0;
      transform: scale(0.5);
      animation: gentleAppear 0.6s ease-out forwards;
    }
    @keyframes gentleAppear {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      70% {
        opacity: 0.8;
        transform: scale(1.05);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    #Home {
      width: 40vmin;
      max-width: 250px;
      height: 10vmin;
      max-height: 60px;
      background-color: #7a7a8a;
      border: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 3vmin;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      color: #e0e0e0;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.4s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    #Home:hover {
      background-color: #8a8a9a;
      transform: scale(1.02);
    }
    #Home:active {
      transform: scale(0.98);
    }

    @media (max-width: 480px) {
      #DrawText {
        font-size: 12vmin;
        gap: 1.5vmin;
      }
    }

    /* Fallende Blätter (neutral) */
    #leaf-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <canvas id="leaf-canvas"></canvas>
  <div id="DrawText">
    🤝 DRAW! 🤝
  </div>
  <button id="Home" onclick="window.location.href='../../index.html'">Back to Menu</button>

  <script>
    // Sanft fallende Blätter (neutral, weder fröhlich noch traurig)
    const canvas = document.getElementById('leaf-canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    
    canvas.width = width;
    canvas.height = height;
    
    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });
    
    class Leaf {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = Math.random() * 15 + 8;
        this.speedY = Math.random() * 3 + 2;
        this.speedX = (Math.random() - 0.5) * 1.2;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 4;
        // Neutrale Herbstfarben (weder neon noch dunkel)
        const neutralColors = [
          '#c0a080',  # Beige
          '#b09070',  # Braun-beige
          '#a08060',  # Braun
          '#d0b090',  # Hell-beige
          '#b8a088',  # Taupe
          '#c8b098'   # Sand
        ];
        this.color = neutralColors[Math.floor(Math.random() * neutralColors.length)];
      }
      
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotationSpeed;
        
        if (this.y > height + 50) {
          this.y = -50;
          this.x = Math.random() * width;
        }
        if (this.x > width + 50) this.x = -50;
        if (this.x < -50) this.x = width + 50;
      }
      
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation * Math.PI / 180);
        ctx.shadowBlur = 0;
        ctx.fillStyle = this.color;
        ctx.strokeStyle = '#8a6a4a';
        ctx.lineWidth = 0.8;
        
        // Blatt-Form
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size/2, this.size/1.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        // Blattader
        ctx.beginPath();
        ctx.moveTo(0, -this.size/2);
        ctx.lineTo(0, this.size/2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-this.size/4, -this.size/4);
        ctx.lineTo(this.size/4, -this.size/4);
        ctx.stroke();
        
        ctx.restore();
      }
    }
    
    const leafCount = 80;
    const leaves = [];
    for (let i = 0; i < leafCount; i++) {
      leaves.push(new Leaf());
    }
    
    function animateLeaves() {
      ctx.clearRect(0, 0, width, height);
      for (let l of leaves) {
        l.update();
        l.draw();
      }
      requestAnimationFrame(animateLeaves);
    }
    
    animateLeaves();
  </script>
</body>
</html>
