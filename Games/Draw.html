<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw - GameCombo</title>
  <link rel="manifest" href="../manifest.json" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: linear-gradient(135deg, #4a4a6a, #3a3a5a);
      display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
    }
    #DrawText {
      font-size: 15vmin; font-weight: 700; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #c0c0c0; text-align: center; margin-bottom: 20px; text-shadow: 0 0 8px #999;
      white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 2vmin; z-index: 10;
      opacity: 0; transform: scale(0.5); animation: gentleAppear 0.6s ease-out forwards;
    }
    @keyframes gentleAppear { 0% { opacity: 0; transform: scale(0.5); } 70% { opacity: 0.8; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    .trophy-counter {
      background: rgba(0,0,0,0.5); border-radius: 50px; padding: 12px 24px; margin-bottom: 30px;
      display: flex; align-items: center; gap: 12px; font-family: 'Segoe UI', sans-serif;
      font-size: 4vmin; font-weight: bold; color: #ffd700; backdrop-filter: blur(5px); z-index: 10;
      border: 1px solid rgba(255,215,0,0.3); animation: fadeInUp 0.5s ease-out 0.3s forwards;
    }
    .trophy-value {
      background: #000; padding: 4px 12px; border-radius: 30px; color: #ffd700;
      font-family: monospace; font-size: 4.5vmin; min-width: 80px; text-align: center;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    #Home {
      width: 40vmin; max-width: 250px; height: 10vmin; max-height: 60px;
      background-color: #ffcc00;
      border: none;
      font-family: 'Segoe UI', sans-serif;
      font-size: 3vmin;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      color: #1e3c72;
      z-index: 11;
      box-shadow: 0 0 15px rgba(255,204,0,0.5);
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.5s forwards;
    }
    #Home:hover { background-color: yellow; transform: scale(1.02); }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @media (max-width: 480px) {
      #DrawText { font-size: 12vmin; gap: 1.5vmin; }
      .trophy-counter { padding: 8px 16px; font-size: 3.5vmin; }
      .trophy-value { font-size: 4vmin; min-width: 60px; }
    }
    #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div id="DrawText">🤝 DRAW! 🤝</div>
  <div class="trophy-counter">
    <span>🏆</span>
    <span>Trophies gained:</span>
    <span class="trophy-value" id="trophyValue">0</span>
  </div>
  <button id="Home" onclick="window.location.href='../../index.html'">Back to Menu</button>

  <script>
    function showTrophies() {
      let trophies = sessionStorage.getItem("Trophies");
      if (!trophies) trophies = localStorage.getItem("Trophies");
      document.getElementById('trophyValue').innerText = (trophies && !isNaN(trophies)) ? trophies : "0";
    }
    showTrophies();

    // Fallende neutrale Partikel
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight;
    canvas.width = width; canvas.height = height;
    window.addEventListener('resize', () => {
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width; canvas.height = height;
    });
    class Particle {
      constructor() {
        this.x = Math.random() * width; this.y = Math.random() * -height; this.size = Math.random() * 12 + 6;
        this.speedY = Math.random() * 3 + 1.5; this.speedX = (Math.random() - 0.5) * 1;
        this.opacity = Math.random() * 0.5 + 0.3;
        const neutralColors = ['#c4a882', '#b89a72', '#d4b892', '#a88a62', '#c8aa7a', '#b09060', '#d0b088'];
        this.color = neutralColors[Math.floor(Math.random() * neutralColors.length)];
      }
      update() {
        this.y += this.speedY; this.x += this.speedX;
        if (this.y > height + 50) { this.y = -50; this.x = Math.random() * width; }
        if (this.x > width + 50) this.x = -50; if (this.x < -50) this.x = width + 50;
      }
      draw() {
        ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.ellipse(this.x, this.y, this.size/2, this.size/1.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = this.opacity * 0.6; ctx.fillStyle = '#8a6a4a';
        ctx.beginPath(); ctx.ellipse(this.x - 1, this.y - 1, this.size/6, this.size/6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
    const particles = Array.from({ length: 120 }, () => new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
