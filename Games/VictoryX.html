<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victory! - GameCombo</title>
  <link rel="manifest" href="../manifest.json" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #GameOver {
      font-size: 15vmin;
      font-weight: 700;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: gold;
      text-align: center;
      margin-bottom: 40px;
      text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    #Home {
      width: 40vmin;
      max-width: 250px;
      height: 10vmin;
      max-height: 60px;
      background-color: gold;
      border: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 3vmin;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      color: #1e3c72;
    }
    #Home:hover {
      background-color: #ffcc00;
      transform: scale(1.02);
    }
    #Home:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div id="GameOver">🏆 PLAYER X HAS WON! 🏆</div>
  <button id="Home" onclick="window.location.href='../../index.html'">Back to Menu</button>
</body>
</html>
