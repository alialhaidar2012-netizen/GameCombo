<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>snake-Map1</title>
      <link rel="manifest" href="../../manifest.json" />
    <style>
.buttons {
    width: 15vmin;
    height: 15vmin;
    border: 3px solid black;
    background-color: yellow;
    color: black;
    position: fixed;
    z-index: 2;
    font-size: 6vmin;
    font-weight: bold;
    border-radius: 3vmin;
    bottom: 5vmin;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
#Oben { left: 5vmin; bottom: 20vmin; }
#Unten { left: 5vmin; bottom: 4vmin; }
#Links { right: 20vmin; bottom: 12vmin; }
#Rechts { right: 4vmin; bottom: 12vmin; }

@media (max-width: 500px) {
    .buttons {
        width: 18vmin;
        height: 18vmin;
        font-size: 7vmin;
        border-width: 4px;
    }
    #Oben { left: 4vmin; bottom: 22vmin; }
    #Unten { left: 4vmin; bottom: 3vmin; }
    #Links { right: 22vmin; bottom: 12vmin; }
    #Rechts { right: 3vmin; bottom: 12vmin; }
}

@media (max-width: 400px) {
    .buttons {
        width: 25vmin;
        height: 25vmin;
        font-size: 8vmin;
    }
    #Oben { left: 3vmin; bottom: 24vmin; }
    #Unten { left: 3vmin; bottom: 3vmin; }
    #Links { right: 24vmin; bottom: 12vmin; }
    #Rechts { right: 3vmin; bottom: 12vmin; }
}
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="points">0 out of 10 points</div>
<button id="Oben" class="buttons">W</button>
<button id="Unten" class="buttons">S</button>
<button id="Links" class="buttons">A</button>
<button id="Rechts" class="buttons">D</button>
     <script type="module">
import{
   spielBeenden, 
    getTrophiesforLevel
} from '../../Benutzerkonten_und_Ranglisten/Rangliste_und_Anmelden.js';


    if (sessionStorage.getItem("skipTutorial") !== "true" && localStorage.getItem("tutorialSkippedSnake") !== "true") {
        window.location.replace("Snake_Tutorial.html");
    }
   sessionStorage.clear();
         
    var canvas = document.getElementById("canvas");
    var ctx = canvas.getContext("2d");

    window.addEventListener('load', function() {
        console.log("You are Connected to the server");
    }, false);

    document.getElementById("Oben").addEventListener("click", function() {
        if (schlange.richtung != "S") { schlange.richtung = "N"; spiel.tick(); }
    });
    document.getElementById("Unten").addEventListener("click", function() {
        if (schlange.richtung != "N") { schlange.richtung = "S"; spiel.tick(); }
    });
    document.getElementById("Links").addEventListener("click", function() {
        if (schlange.richtung != "O") { schlange.richtung = "W"; spiel.tick(); }
    });
    document.getElementById("Rechts").addEventListener("click", function() {
        if (schlange.richtung != "W") { schlange.richtung = "O"; spiel.tick(); }
    });

    var spiel = {
        anzahlTicks: 0, timer: null, punkte: 0,
        spielfeld: [
            "###############",
            "#             #",
            "#             #",
            "#             #",
            "#     ###     #",
            "#     ###     #",
            "#             #",
            "#             #",
            "#             #",
            "#             #",
            "###############"
        ],
        früchte: [{ x: 1, y: 1 }],
        tick: async function() {
            window.clearTimeout(spiel.timer);
            spiel.anzahlTicks++;
            if (spiel.anzahlTicks % 10 == 0) spiel.neueZufallsfrucht();

            var scaleX = canvas.width / welt.breite;
            var scaleY = canvas.height / welt.höhe;
            ctx.save();
            ctx.scale(scaleX, scaleY);

            var ergebnis = schlange.gehe();

            if (ergebnis == "Ende") {
                let level = 1;
                const regeln = getTrophiesforLevel("snake", level);
                if (spiel.punkte >= 10) {
                    const result = await spielBeenden("snake", level, true);
                    localStorage.setItem("Score", spiel.punkte);
                    localStorage.setItem("Trophies", regeln.sieg);
                    localStorage.setItem("Victory", "true");
                    window.location.replace("../Victory.html");
                } else {
                    const result = await spielBeenden("snake", level, false);
                    localStorage.setItem("Score", spiel.punkte);
                    localStorage.setItem("Trophies", -regeln.verlust);
                    localStorage.setItem("Victory", "false");
                    window.location.replace("../Game_Over.html");
                }
                return;
            }
            grafik.zeichneSpiel();
            ctx.restore();
            spiel.timer = window.setTimeout(function() { spiel.tick(); }, 500);
        },
        neueZufallsfrucht: function() {
            var zufallY = Math.floor(Math.random() * spiel.spielfeld.length);
            var zufallX = Math.floor(Math.random() * spiel.spielfeld[zufallY].length);
            var zufallsort = { x: zufallX, y: zufallY };
            if (spiel.istFrei(zufallsort) && !spiel.istFrucht(zufallsort)) spiel.früchte.push(zufallsort);
        },
        istFrei: function(ort) { return spiel.spielfeld[ort.y][ort.x] == " "; },
        istWand: function(ort) { return spiel.spielfeld[ort.y][ort.x] == "#"; },
        istSchlange: function(ort) {
            for (var teilNr = 0; teilNr < schlange.teile.length; teilNr++) {
                var teil = schlange.teile[teilNr];
                if (ort.x == teil.x && ort.y == teil.y) return true;
            }
            return false;
        },
        istFrucht: function(ort) {
            for (var fruchtNr = 0; fruchtNr < spiel.früchte.length; fruchtNr++) {
                var frucht = spiel.früchte[fruchtNr];
                if (ort.x == frucht.x && ort.y == frucht.y) { spiel.früchte.splice(fruchtNr, 1); return true; }
            }
            return false;
        }
    };

    var schlange = {
        teile: [{ x: 4, y: 2 }, { x: 3, y: 2 }, { x: 2, y: 2 }],
        richtung: "O",
        nächsterOrt: function() {
            var kopf = schlange.teile[0];
            var zielX = kopf.x, zielY = kopf.y;
            zielY = schlange.richtung == "N" ? zielY - 1 : zielY;
            zielY = schlange.richtung == "S" ? zielY + 1 : zielY;
            zielX = schlange.richtung == "W" ? zielX - 1 : zielX;
            zielX = schlange.richtung == "O" ? zielX + 1 : zielX;
            return { x: zielX, y: zielY };
        },
        gehe: function() {
            var ort = schlange.nächsterOrt();
            if (spiel.istWand(ort) || spiel.istSchlange(ort)) return "Ende";
            if (spiel.istFrei(ort)) { schlange.teile.unshift(ort); schlange.teile.pop(); }
            if (spiel.istFrucht(ort)) {
                spiel.punkte++;
                points.innerText = spiel.punkte + " out of 10 points";
                schlange.teile.unshift(ort);
            }
            if (spiel.punkte === 0) points.innerText = spiel.punkte + " out of 10 points";
        }
    };

    var welt = { breite: 480, höhe: 330 };

    var grafik = {
        canvas: document.getElementById("canvas"), größeQuadrat: 30,
        zeichneSpielfeld: function(ctx) {
            var y = 0;
            spiel.spielfeld.forEach(function(string) {
                var zeile = string.split(""), x = 0;
                zeile.forEach(function(zeichen) {
                    if (zeichen == "#") { ctx.fillStyle = "black"; ctx.fillRect(x, y, grafik.größeQuadrat, grafik.größeQuadrat); }
                    x += grafik.größeQuadrat;
                });
                y += grafik.größeQuadrat;
            });
        },
        zeichne: function(ctx, quelle, farbe) {
            quelle.forEach(function(teil) {
                ctx.fillStyle = farbe;
                ctx.fillRect(teil.x * grafik.größeQuadrat, teil.y * grafik.größeQuadrat, grafik.größeQuadrat, grafik.größeQuadrat);
            });
        },
        zeichneSpiel: function() {
            var ctx = grafik.canvas.getContext("2d");
            ctx.clearRect(0, 0, grafik.canvas.width, grafik.canvas.height);
            grafik.zeichneSpielfeld(ctx);
            grafik.zeichne(ctx, spiel.früchte, "red");
            grafik.zeichne(ctx, schlange.teile, "green");
        }
    };

    function resizeCanvas() {
        var verhältnis = welt.breite / welt.höhe;
        if (window.innerWidth / window.innerHeight > verhältnis) {
            canvas.height = window.innerHeight;
            canvas.width = window.innerHeight * verhältnis;
        } else {
            canvas.width = window.innerWidth;
            canvas.height = window.innerWidth / verhältnis;
        }
        canvas.style.left = (window.innerWidth - canvas.width) / 2 + "px";
        canvas.style.top = (window.innerHeight - canvas.height) / 2 + "px";
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    grafik.zeichneSpiel();

    var spielSteuerung = {
        verarbeiteEingabe: function(keyPressed) {
            var taste = keyPressed.key.toLowerCase();
            if (taste == "w" && schlange.richtung != "S") schlange.richtung = "N";
            if (taste == "d" && schlange.richtung != "W") schlange.richtung = "O";
            if (taste == "s" && schlange.richtung != "N") schlange.richtung = "S";
            if (taste == "a" && schlange.richtung != "O") schlange.richtung = "W";
            spiel.tick();
        },
        starteSpiel: function() {
            window.addEventListener("keypress", spielSteuerung.verarbeiteEingabe, false);
            spiel.tick();
        }
    };
    spielSteuerung.starteSpiel();
</script>
</body>
</html>
