<!DOCTYPE html>
<html lang="de">
<head lang="de">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Super Cat</title>
  <link rel="manifest" href="../../manifest.json" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: lightgray;
    }
    #Spiel {
      display: block;
      width: 100%;
      height: 100%;
    }
    .buttons {
      width: 12vmin;
      height: 12vmin;
      border: 2px solid black;
      background-color: yellow;
      color: black;
      position: fixed;
      z-index: 2;
      font-size: 5vmin;
      font-weight: bold;
      border-radius: 2vmin;
      bottom: 5vmin;
    }
    #Oben {
      left: 5vmin;
    }
    #Links {
      right: 17vmin;
    }
    #Rechts {
      right: 3vmin;
    }
  </style>  
</head>
<body>
  <canvas id="Spiel" width=640 height=480></canvas>
  <button id="Oben" class="buttons">W</button>
  <button id="Links" class="buttons">A</button>
  <button id="Rechts" class="buttons">D</button>
  
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <script type="module">
    import {
      spielBeenden,
      getTrophiesforLevel
    } from '../../Benutzerkonten_und_Ranglisten/Rangliste_und_Anmelden.js';

    if (sessionStorage.getItem("skipTutorial") !== "true" && localStorage.getItem("tutorialSkippedCat") !== "true") {
      window.location.replace("Super_Cat_Tutorial.html");
    }
    sessionStorage.clear();

    // ========== DEBUG FUNKTION ==========
    function debugLog(msg, data) {
      console.log(`[DEBUG] ${msg}`, data || '');
    }
    debugLog("Spiel gestartet");

    const canvas = document.getElementById("Spiel");
    let ctx = canvas.getContext("2d");

    // Touch-Events
    document.getElementById("Oben").addEventListener("touchstart", function(e) {
      e.preventDefault();
      spiel.steuerung.hoch = true;
      debugLog("Touch Oben: true");
    }, {passive: false});
    document.getElementById("Oben").addEventListener("touchend", function(e) {
      e.preventDefault();
      spiel.steuerung.hoch = false;
      debugLog("Touch Oben: false");
    }, {passive: false});

    document.getElementById("Links").addEventListener("touchstart", function(e) {
      e.preventDefault();
      spiel.steuerung.links = true;
      debugLog("Touch Links: true");
    }, {passive: false});
    document.getElementById("Links").addEventListener("touchend", function(e) {
      e.preventDefault();
      spiel.steuerung.links = false;
      debugLog("Touch Links: false");
    }, {passive: false});

    document.getElementById("Rechts").addEventListener("touchstart", function(e) {
      e.preventDefault();
      spiel.steuerung.rechts = true;
      debugLog("Touch Rechts: true");
    }, {passive: false});
    document.getElementById("Rechts").addEventListener("touchend", function(e) {
      e.preventDefault();
      spiel.steuerung.rechts = false;
      debugLog("Touch Rechts: false");
    }, {passive: false});

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      debugLog("Canvas resized:", canvas.width + "x" + canvas.height);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let spiel = {
      timer: null,
      beendet: false,
      steuerung: {
        hoch: false,
        runter: false,
        links: false,
        rechts: false,
        mapping: {
          65: "links",
          68: "rechts",
          87: "hoch",
          83: "runter"
        },
        buttonPress: function(keyInfo) {
          this[this.mapping[keyInfo.keyCode]] = true;
          debugLog("Taste gedrückt:", keyInfo.keyCode + " -> " + this.mapping[keyInfo.keyCode]);
        },
        buttonRelease: function(keyInfo) {
          this[this.mapping[keyInfo.keyCode]] = false;
          debugLog("Taste losgelassen:", keyInfo.keyCode + " -> " + this.mapping[keyInfo.keyCode]);
        },
        connect: function() {
          window.addEventListener("keydown", (event) => {
            this.buttonPress(event);
          });
          window.addEventListener("keyup", (event) => {
            this.buttonRelease(event);
          });
          debugLog("Tastatur-Steuerung verbunden");
        }
      },
      sounds: {
        springe: function() {
          try {
            new Audio("sounds/meow.wav").play();
            debugLog("Spring-Sound abgespielt");
          } catch(e) {
            debugLog("Spring-Sound Fehler:", e);
          }
        }
      },
      schleife: function() {
        if (this.beendet) {
          debugLog("Spiel beendet - Schleife stoppt");
          return;
        }
        
        let scaleX = canvas.width / welt.breite;
        let scaleY = canvas.height / welt.höhe;
        ctx.save();
        ctx.scale(scaleX, scaleY);
        
        welt.tick();
        welt.zeichne();
        spieler.tick();
        spieler.zeichne();
        
        ctx.restore();
        this.timer = window.setTimeout(() => { this.schleife(); }, 1000/60);
      },
      start: function() {
        debugLog("Spiel startet...");
        this.steuerung.connect();
        this.schleife();
        debugLog("Spiel läuft");
      },
      stopp: async function(grund) {
        debugLog("Spiel stoppt, Grund:", grund);
        this.beendet = true;
        window.clearTimeout(this.timer);
        let gewonnen = (grund === "gewonnen");
        let level = 1;
        const regeln = getTrophiesforLevel("Super_Cat", level);
        if (gewonnen) {
          const result = await spielBeenden("Super_Cat", level, true);
          localStorage.setItem("Victory", "true");
          localStorage.setItem("Trophies", regeln.sieg);
          debugLog("Spiel gewonnen!");
          window.location.replace("../Victory.html");
        } else {
          const result = await spielBeenden("Super_Cat", level, false);
          localStorage.setItem("Victory", "false");
          localStorage.setItem("Trophies", -regeln.verlust);
          debugLog("Spiel verloren!");
          window.location.replace("../GameOver.html");
        }
      }
    };

    let welt = {
      höhe: 480,
      breite: 640,
      schwerkraft: 0.8,
      strecke: 0,
      level: null,
      kollisionskarte: null,
      tickZähler: 0,
      feinde: [],
      ladeLevel: function() {
        debugLog("Lade Level...");
        this.level = new Image();
        this.level.src = "level.png";
        this.level.onload = function() {
          debugLog("Level Bild geladen:", this.width + "x" + this.height);
        };
        this.level.onerror = function() {
          debugLog("FEHLER: Level Bild konnte nicht geladen werden!");
        };
        
        // Erstelle eine Kollisionskarte direkt im Code
        debugLog("Erstelle Kollisionskarte...");
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = 640;
        tempCanvas.height = 480;
        const tempCtx = tempCanvas.getContext("2d");
        
        // Hintergrund weiß (durchsichtig)
        tempCtx.fillStyle = "white";
        tempCtx.fillRect(0, 0, 640, 480);
        
        // Boden (schwarze Linie) - Y-Position 430
        tempCtx.fillStyle = "black";
        tempCtx.fillRect(0, 430, 640, 50);
        debugLog("Boden erstellt bei y=430");
        
        // Grüne Ausgänge
        tempCtx.fillStyle = "rgb(76, 255, 0)";
        tempCtx.fillRect(590, 400, 40, 30);
        debugLog("Ausgänge erstellt");
        
        // Rote Gruben
        tempCtx.fillStyle = "red";
        tempCtx.fillRect(180, 420, 60, 30);
        tempCtx.fillRect(350, 420, 60, 30);
        debugLog("Gruben erstellt");
        
        this.kollisionskarte = tempCtx;
        debugLog("Kollisionskarte erfolgreich erstellt");
        
        // Teste die Kollisionskarte
        debugLog("Test Boden bei (100,430):", this.pixeltyp(100, 430));
        debugLog("Test Boden bei (100,431):", this.pixeltyp(100, 431));
        debugLog("Test Boden bei (100,429):", this.pixeltyp(100, 429));
        debugLog("Test Luft bei (100,400):", this.pixeltyp(100, 400));
        
        // Feinde hinzufügen - jetzt auf dem Boden (y=400)
        this.feinde.push(new Feind(500, 400));
        this.feinde.push(new Feind(2000, 400));
        this.feinde.push(new Feind(3700, 400));
        this.feinde.push(new Feind(4000, 400));
        this.feinde.push(new Feind(5600, 400));
        this.feinde.push(new Feind(6500, 400));
        this.feinde.push(new Feind(7600, 400));
        debugLog("Feinde hinzugefügt");
      },
      istFesteOberfläche: function(x, y) {
        if (!this.kollisionskarte) {
          debugLog("Keine Kollisionskarte vorhanden!");
          return false;
        }
        // Prüfe ob die Position innerhalb der Karte ist
        if (x < 0 || x >= 640 || y < 0 || y >= 480) {
          debugLog("Position außerhalb der Karte:", x, y);
          return false;
        }
        
        try {
          let rohdaten = this.kollisionskarte.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
          // Wenn schwarz (0,0,0) -> feste Oberfläche
          let isSolid = rohdaten[0] === 0 && rohdaten[1] === 0 && rohdaten[2] === 0;
          if (isSolid) {
            // Nur bei wichtigen Positionen loggen
            if ((y >= 430 && y <= 435) || (x === 100 && y === 430)) {
              debugLog("Feste Oberfläche bei:", x, y);
            }
          }
          return isSolid;
        } catch(e) {
          debugLog("Fehler bei istFesteOberfläche:", e);
          return false;
        }
      },
      pixeltyp: function(x, y) {
        if (!this.kollisionskarte) {
          debugLog("Keine Kollisionskarte für pixeltyp");
          return ".";
        }
        if (x < 0 || x >= 640 || y < 0 || y >= 480) {
          debugLog("pixeltyp außerhalb:", x, y);
          return ".";
        }
        
        try {
          let rohdaten = this.kollisionskarte.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
          let r = rohdaten[0], g = rohdaten[1], b = rohdaten[2];
          
          if (r === 255 && g === 0 && b === 0) {
            debugLog("Grube gefunden bei:", x, y);
            return "Grube";
          }
          if (r === 76 && g === 255 && b === 0) {
            debugLog("Ausgang gefunden bei:", x, y);
            return "Ausgang";
          }
          if (r === 0 && g === 0 && b === 0) {
            return "#";
          }
          return ".";
        } catch(e) {
          debugLog("Fehler bei pixeltyp:", e);
          return ".";
        }
      },
      tick: function() {
        if (!this.level) {
          this.ladeLevel();
        }
        this.strecke += spieler.figur.speed;
        this.tickZähler++;
        this.aktiviereFeinde();
      },
      aktiviereFeinde: function() {
        for (var i = 0; i < this.feinde.length; i++) {
          this.feinde[i].tick();
        }
      },
      levelEndOffset: function() {
        return this.level ? this.level.width - this.breite : 0;
      },
      atLevelEnd: function() {
        return this.strecke >= this.levelEndOffset();
      },
      zeichne: function() {
        if (!this.level) return;
        
        let zeichneBeiX = this.strecke * -1;
        zeichneBeiX = zeichneBeiX > 0 ? 0 : zeichneBeiX;
        zeichneBeiX = this.atLevelEnd() ? this.levelEndOffset() * -1 : zeichneBeiX;
        ctx.drawImage(this.level, zeichneBeiX, 0);
        
        for (var i = 0; i < this.feinde.length; i++) {
          this.feinde[i].zeichne();
        }
      }
    };

    let spieler = {
      figur: new Figur(160, 390, 25, 25,
        new Animation("Graphiken/cat", 5),
        new Animation("Graphiken/cat.backwards", 5)
      ),
      tick: function() {
        // Prüfe ob Spieler auf Grube oder Ausgang steht
        let currentLocation = welt.pixeltyp(this.figur.leadingEdge(), this.figur.y);
        if (currentLocation == "Ausgang" || currentLocation == "Grube") {
          let state = currentLocation == "Ausgang" ? "gewonnen" : "verloren";
          debugLog("Spieler auf", currentLocation);
          spiel.stopp(state);
          return;
        }
        this.verarbeiteSteuerung();
        this.figur.tick();
        
        // Debug: Spielerposition loggen
        if (this.figur.y > 480) {
          debugLog("SPIELER AUSSERHALB DES BILDSCHIRMS! y=" + this.figur.y);
        }
      },
      verarbeiteSteuerung: function() {
        if (spiel.steuerung.rechts) {
          this.figur.speed = 5;
        }
        if (spiel.steuerung.links) {
          this.figur.speed = -5;
        }
        if (!spiel.steuerung.links && !spiel.steuerung.rechts) {
          this.figur.speed = 0;
        }
        if (spiel.steuerung.hoch && this.figur.standingOnAPlatform()) {
          this.figur.downwardForce = -12;
          spiel.sounds.springe();
          debugLog("Springe! downwardForce = -12");
        }
      },
      zeichne: function() {
        this.figur.zeichne();
      }
    };

    function Figur(x, y, breite, höhe, laufendeFigur, umgedrehteFigur) {
      this.x = x;
      this.y = y;
      this.höhe = höhe;
      this.breite = breite;
      this.speed = 0;
      this.downwardForce = 0;
      this.jumpHeight = 0;
      this.laufendeFigur = laufendeFigur;
      this.laufendeFigurReversed = umgedrehteFigur;
      this.fallCounter = 0;
      
      this.tick = function() {
        this.applyGravity();
        this.applyMovement();
        
        // Debug: Position loggen wenn fallend
        if (this.isFalling()) {
          this.fallCounter++;
          if (this.fallCounter % 30 === 0) {
            debugLog("Fallend: y=" + this.y + ", downwardForce=" + this.downwardForce);
          }
        } else {
          this.fallCounter = 0;
        }
      };
      
      this.applyGravity = function() {
        if (this.isJumping()) {
          this.jumpHeight += (this.downwardForce * -1);
          if (this.jumpHeight >= this.höhe * 6) {
            this.downwardForce = welt.schwerkraft;
            this.jumpHeight = 0;
            debugLog("Springen beendet, Schwerkraft aktiviert");
          }
        } else {
          if (this.standingOnAPlatform()) {
            this.downwardForce = 0;
            // Debug: Steht auf Plattform
            if (this.fallCounter > 10) {
              debugLog("Steht auf Plattform bei y=" + this.y);
              this.fallCounter = 0;
            }
          } else {
            this.downwardForce = welt.schwerkraft;
          }
        }
      };
      
      this.applyMovement = function() {
        let nextX = this.x + this.speed;
        let nextY = this.y + this.downwardForce;
        
        if (nextX < 0) {
          this.x = 0;
          spiel.stopp("verloren");
          return;
        }
        
        // Horizontale Kollision
        let nextLeadingX = this.leadingEdge() + this.speed;
        let walkingIntoSurface = welt.istFesteOberfläche(nextLeadingX, this.y);
        if (this.isMoving() && walkingIntoSurface) {
          nextX = this.x;
          this.speed = 0;
          debugLog("Horizontale Kollision bei x=" + this.x);
        }
        
        // Vertikale Kollision (Kopf)
        let topLeftIsSolid = welt.istFesteOberfläche(this.leadingEdge(), this.y);
        let topRightIsSolid = welt.istFesteOberfläche(this.trailingEdge(), this.y);
        if ((topLeftIsSolid || topRightIsSolid) && this.isJumping()) {
          this.downwardForce = welt.schwerkraft;
          this.jumpHeight = 0;
          debugLog("Kopf-Kollision, Schwerkraft aktiviert");
        }
        
        // Boden-Kollision
        let bottomLeft = welt.istFesteOberfläche(this.leadingEdge(), this.bottom() + 1);
        let bottomRight = welt.istFesteOberfläche(this.trailingEdge(), this.bottom() + 1);
        if (this.downwardForce > 0 && (bottomLeft || bottomRight)) {
          nextY = this.y;
          this.downwardForce = 0;
          debugLog("Boden-Kollision bei y=" + this.y);
        }
        
        this.x = nextX;
        this.y = nextY;
        
        // Prüfe ob Spieler unterhalb des Bildschirms ist
        if (this.y > 600) {
          debugLog("Spieler zu weit unten! y=" + this.y);
          spiel.stopp("verloren");
        }
      };
      
      this.bottom = function() {
        return this.y + this.höhe;
      };
      
      this.isJumping = function() {
        return this.downwardForce < 0;
      };
      
      this.isFalling = function() {
        return this.downwardForce > 0;
      };
      
      this.isMoving = function() {
        return this.speed != 0;
      };
      
      this.leadingEdge = function() {
        return this.speed < 0 ? this.x : this.x + this.breite;
      };
      
      this.trailingEdge = function() {
        return this.speed < 0 ? this.x + this.breite : this.x;
      };
      
      this.standingOnAPlatform = function() {
        let onPlatform = welt.istFesteOberfläche(this.leadingEdge(), this.bottom() + 1) ||
                         welt.istFesteOberfläche(this.trailingEdge(), this.bottom() + 1);
        return onPlatform;
      };
      
      this.zeichne = function() {
        if (!this.laufendeFigur) return;
        
        let zeichneBeiX = this.x - welt.strecke;
        zeichneBeiX = zeichneBeiX > this.x ? this.x : zeichneBeiX;
        if (welt.atLevelEnd()) {
          zeichneBeiX = (welt.breite - (welt.level.width - welt.strecke - (this.x - welt.strecke)));
        }
        
        let sprite = this.speed < 0 ? this.laufendeFigurReversed : this.laufendeFigur;
        if (this.isJumping() || this.isFalling()) {
          sprite.drawFrame(4, zeichneBeiX, this.y, this.höhe, this.breite);
        } else if (this.isMoving()) {
          sprite.zeichne(welt.tickZähler, zeichneBeiX, this.y, this.höhe, this.breite);
        } else {
          sprite.drawFrame(1, zeichneBeiX, this.y, this.höhe, this.breite);
        }
      };
      
      this.kollidiertMit = function(other) {
        if (this.x >= other.x && this.x <= other.x + other.breite &&
            this.y >= other.y && this.y <= other.y + other.höhe) {
          debugLog("Kollision mit Feind!");
          return true;
        }
        return false;
      };
    }

    function Animation(dateiname, frameZahl) {
      this.frames = [];
      this.currentFrameId = 1;
      for (var frameId = 1; frameId <= frameZahl; frameId++) {
        var frame = new Image();
        frame.src = dateiname + "." + frameId + ".png";
        this.frames[frameId] = frame;
      }
      
      this.zeichne = function(tickZähler, x, y, höhe, breite) {
        if (tickZähler % 5 == 0) {
          this.currentFrameId++;
        }
        this.currentFrameId = this.currentFrameId >= this.frames.length ? 1 : this.currentFrameId;
        this.drawFrame(this.currentFrameId, x, y, höhe, breite);
      };
      
      this.drawFrame = function(frameNumber, x, y, höhe, breite) {
        ctx.drawImage(this.frames[frameNumber], x, y, breite, höhe);
      };
    }

    function Feind(x, y) {
      this.figur = new Figur(x, y, 25, 25,
        new Animation("Graphiken/tiger", 5),
        new Animation("Graphiken/tiger.backwards", 5)
      );
      
      this.tick = function() {
        let distanceFromPlayer = Math.abs(spieler.figur.x - this.figur.x);
        if (distanceFromPlayer <= welt.breite * 2) {
          this.figur.speed = 2;
          if (spieler.figur.x < this.figur.x) {
            this.figur.speed *= -1;
          }
          if (this.figur.kollidiertMit(spieler.figur)) {
            spiel.stopp("verloren");
          }
          this.figur.tick();
        }
      };
      
      this.zeichne = function() {
        this.figur.zeichne();
      };
    }

    debugLog("Starte Spiel...");
    spiel.start();
  </script>
</body>
</html>
