<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victory! - GameCombo</title>
  <link rel="manifest" href="../manifest.json" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    #GameOver {
      font-size: 15vmin;
      font-weight: 700;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: gold;
      text-align: center;
      margin-bottom: 40px;
      text-shadow: 0 0 10px #ff0, 0 0 20px #ff0, 0 0 30px #ff0;
      animation: pulse 1.5s ease-in-out infinite;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2vmin;
      z-index: 10;
    }
    @keyframes pulse {
      0% { transform: scale(1); text-shadow: 0 0 10px #ff0; }
      50% { transform: scale(1.05); text-shadow: 0 0 30px #ff0, 0 0 50px #ffaa00; }
      100% { transform: scale(1); text-shadow: 0 0 10px #ff0; }
    }
    #Home {
      width: 40vmin;
      max-width: 250px;
      height: 10vmin;
      max-height: 60px;
      background-color: gold;
      border: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 3vmin;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      color: #1e3c72;
      z-index: 10;
      box-shadow: 0 0 15px rgba(255,215,0,0.5);
    }
    #Home:hover {
      background-color: #ffcc00;
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(255,215,0,0.8);
    }
    #Home:active {
      transform: scale(0.98);
    }

    @media (max-width: 480px) {
      #GameOver {
        font-size: 12vmin;
        gap: 1.5vmin;
      }
    }

    /* Konfetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div id="GameOver">
    🏆 VICTORY! 🏆
  </div>
  <button id="Home" onclick="window.location.href='../../index.html'">Back to Menu</button>

  <script>
    // Neon-Konfetti Animation
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    
    canvas.width = width;
    canvas.height = height;
    
    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });
    
    class Confetti {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height - height;
        this.size = Math.random() * 8 + 4;
        this.speedY = Math.random() * 5 + 3;
        this.speedX = (Math.random() - 0.5) * 2;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 10;
        // Neon-Farben
        const neonColors = [
          '#ff00ff', // Magenta neon
          '#00ffff', // Cyan neon
          '#ff0000', // Rot neon
          '#00ff00', // Grün neon
          '#ffff00', // Gelb neon
          '#ff8800', // Orange neon
          '#ff00cc', // Pink neon
          '#44ff44'  // Hellgrün neon
        ];
        this.color = neonColors[Math.floor(Math.random() * neonColors.length)];
      }
      
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotationSpeed;
        
        if (this.y > height) {
          this.y = -20;
          this.x = Math.random() * width;
        }
        if (this.x > width) this.x = 0;
        if (this.x < 0) this.x = width;
      }
      
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation * Math.PI / 180);
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.restore();
      }
    }
    
    const confettiCount = 150;
    const confettis = [];
    for (let i = 0; i < confettiCount; i++) {
      confettis.push(new Confetti());
    }
    
    function animateConfetti() {
      ctx.clearRect(0, 0, width, height);
      for (let c of confettis) {
        c.update();
        c.draw();
      }
      requestAnimationFrame(animateConfetti);
    }
    
    animateConfetti();
  </script>
</body>
</html>
