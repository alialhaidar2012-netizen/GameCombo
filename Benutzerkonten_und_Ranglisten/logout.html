<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GameCombo</title>
    <link rel="manifest" href="../manifest.json" />
    <style>
        /* === YOUR GAME DESIGN GOES HERE === */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .sub {
            color: #666;
            margin-bottom: 30px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #2a5298;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            background: #1e3c72;
        }
        
        .google-btn {
            background: #db4437;
            margin-top: 10px;
        }
        
        .google-btn:hover {
            background: #c53727;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #666;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        
        .divider::before {
            margin-right: 10px;
        }
        
        .divider::after {
            margin-left: 10px;
        }
        
        .link {
            margin-top: 20px;
            color: #666;
        }
        
        .link a {
            color: #2a5298;
            text-decoration: none;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 GameCombo</h1>
        <p class="sub">Sign out</p>
      <div id="message"></div>
      <button onclick="SO()">Sign out</button>
    </div>
    <script src="./Rangliste_und_Anmelden.js" type="module"></script>
    <script>
     function SO(){
       let currentUser = false;
       if(currentUser){
         message.innerText = "Something went wrong please try again";
       }
       window.location.replace("./register.html");
     }
    </script>
</body>
</html>
